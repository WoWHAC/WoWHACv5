name: Package Release

concurrency: production

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up tag
        id: tag
        run: |
          VERSION="$(python3 scripts/sync_version.py)"
          TAG="v$VERSION"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          git tag "$TAG"
          git push origin "$TAG"
      - name: Install zip/unzip
        run: sudo apt-get install -y zip unzip
      - name: Prepare archives
        run: |
          OUTDIR="$(mktemp -d)"
          echo "OUTDIR=$OUTDIR" >> $GITHUB_ENV
          for f in prebuilds/*.zip; do
            name=$(basename "$f")
            workdir=$(mktemp -d)
            unzip -q "$f" -d "$workdir"
            mkdir -p "$workdir/WoWHACv5"
            cp -r src/* "$workdir/WoWHACv5/"
            if [ "$name" = "16001JustAC.zip" ]; then
              sed -i -E '/^## Interface:/ { /(^|[[:space:],])16001([[:space:],]|$)/! s/[[:space:]]*$/, 16001/; }' "$workdir/WoWHACv5/WoWHACv5.toc"
            fi
            (cd "$workdir" && zip -qr "$OUTDIR/$name" .)
            rm -rf "$workdir"
          done
          python3 scripts/package_priority_assistant.py --output "$OUTDIR"
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ env.OUTDIR }}/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
